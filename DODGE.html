<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DODGE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #0a0a0f; overflow: hidden; touch-action: none; }
canvas { position: fixed; top: 0; left: 0; }
#ui { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; z-index: 10; pointer-events: none; }
.stat { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 2px; font-family: 'Courier New', monospace; }
.stat span { color: #a78bfa; }
#overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,15,0.93); z-index: 20; font-family: 'Courier New', monospace; }
#overlay h1 { font-size: clamp(40px,8vw,80px); font-weight: 700; color: #fff; letter-spacing: 8px; margin-bottom: 12px; }
#overlay p { font-size: clamp(13px,3vw,16px); color: rgba(255,255,255,0.5); letter-spacing: 3px; margin-bottom: 40px; }
#startBtn { background: #7c3aed; border: none; color: white; padding: 18px 56px; font-size: 17px; font-weight: 700; letter-spacing: 3px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; transition: background 0.2s, transform 0.1s; }
#startBtn:hover { background: #6d28d9; transform: scale(1.04); }
.sub { font-size: 13px; color: rgba(255,255,255,0.3); margin-top: 16px; letter-spacing: 2px; }
#best { font-size: 14px; color: rgba(167,139,250,0.7); margin-top: 20px; letter-spacing: 2px; }
#dpad { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: none; z-index: 10; user-select: none; font-family: 'Courier New', monospace; }
#dpad button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.8); width: 72px; height: 72px; font-size: 26px; border-radius: 12px; cursor: pointer; }
#dpad button.pressed { background: rgba(124,58,237,0.45); border-color: #a78bfa; }
.dpad-row { display: flex; gap: 6px; justify-content: center; margin: 3px 0; }
</style>
</head>
<body>
<div id="ui">
  <div class="stat">SCORE <span id="score">0</span></div>
  <div class="stat">NIVEAU <span id="level">1</span></div>
  <div class="stat">VIES <span id="lives">♥♥♥</span></div>
</div>
<canvas id="c"></canvas>
<div id="dpad">
  <div class="dpad-row"><button id="up">↑</button></div>
  <div class="dpad-row"><button id="left">←</button><button id="down">↓</button><button id="right">→</button></div>
</div>
<div id="overlay">
  <h1>DODGE</h1>
  <p>ÉVITE LES OBSTACLES — SURVIVE</p>
  <button id="startBtn">JOUER</button>
  <div class="sub">⌨ ZQSD / WASD / FLÈCHES &nbsp;·&nbsp; 📱 D-PAD</div>
  <div id="best"></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const bestEl = document.getElementById('best');
const dpad = document.getElementById('dpad');

let W, H, game, animId, best = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (game) game.resize();
}
window.addEventListener('resize', resize);
resize();

const isMobile = () => window.innerWidth < 700 || 'ontouchstart' in window;

class Particle {
  constructor(x, y, color) {
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*6; this.vy=(Math.random()-0.5)*6;
    this.life=1; this.decay=0.03+Math.random()*0.04;
    this.size=3+Math.random()*5; this.color=color;
  }
  update() { this.x+=this.vx; this.y+=this.vy; this.life-=this.decay; this.vy+=0.12; }
  draw() { ctx.save(); ctx.globalAlpha=this.life; ctx.fillStyle=this.color; ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size); ctx.restore(); }
}

class Star {
  constructor() { this.reset(); this.y=Math.random()*H; }
  reset() { this.x=Math.random()*W; this.y=-2; this.size=Math.random()*2+0.5; this.speed=0.6+Math.random()*2; this.alpha=Math.random()*0.5+0.2; }
  update(speed) { this.y+=this.speed*(1+speed*0.1); if(this.y>H) this.reset(); }
  draw() { ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle='#fff'; ctx.fillRect(this.x,this.y,this.size,this.size); ctx.restore(); }
}

class Obstacle {
  constructor(level) {
    const types=['rect','diamond','ring'];
    this.type=types[Math.floor(Math.random()*types.length)];
    this.w=24+Math.random()*40; this.h=24+Math.random()*40;
    this.x=Math.random()*(W-80)+40; this.y=-60;
    const base=2.8+level*0.45;
    this.vy=base+Math.random()*2.5; this.vx=(Math.random()-0.5)*(level*0.35);
    this.rot=0; this.rotSpeed=(Math.random()-0.5)*0.09;
    const colors=['#f472b6','#fb923c','#facc15','#34d399','#60a5fa','#c084fc','#f87171'];
    this.color=colors[Math.floor(Math.random()*colors.length)];
    this.pulse=Math.random()*Math.PI*2;
    this.r=Math.max(this.w,this.h)/2;
  }
  update() { this.x+=this.vx; this.y+=this.vy; this.rot+=this.rotSpeed; this.pulse+=0.07; if(this.x<this.r||this.x>W-this.r) this.vx*=-1; }
  draw() {
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    const g=0.6+Math.sin(this.pulse)*0.35;
    ctx.shadowColor=this.color; ctx.shadowBlur=16*g;
    ctx.strokeStyle=this.color; ctx.lineWidth=2.5; ctx.globalAlpha=g;
    if(this.type==='rect') {
      ctx.strokeRect(-this.w/2,-this.h/2,this.w,this.h);
      ctx.globalAlpha=g*0.15; ctx.fillStyle=this.color; ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
    } else if(this.type==='diamond') {
      ctx.beginPath(); ctx.moveTo(0,-this.h/2); ctx.lineTo(this.w/2,0); ctx.lineTo(0,this.h/2); ctx.lineTo(-this.w/2,0); ctx.closePath(); ctx.stroke();
      ctx.globalAlpha=g*0.15; ctx.fillStyle=this.color; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,0,this.r/2,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=g*0.4; ctx.beginPath(); ctx.arc(0,0,this.r/2-6,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
  hits(p) { const dx=this.x-p.x,dy=this.y-p.y; return Math.sqrt(dx*dx+dy*dy)<this.r/2+p.size-5; }
  offscreen() { return this.y>H+80; }
}

class Player {
  constructor() { this.size=16; this.x=W/2; this.y=H*0.8; this.vx=0; this.vy=0; this.trail=[]; this.invincible=0; this.pulse=0; }
  resize() { this.x=Math.max(this.size,Math.min(W-this.size,this.x)); this.y=Math.max(this.size,Math.min(H-this.size,this.y)); }
  update(keys,speed) {
    const acc=0.55;
    if(keys.left) this.vx-=acc; if(keys.right) this.vx+=acc;
    if(keys.up) this.vy-=acc; if(keys.down) this.vy+=acc;
    this.vx*=0.78; this.vy*=0.78; this.vy+=speed*0.04;
    const maxV=6, vel=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(vel>maxV){this.vx=this.vx/vel*maxV;this.vy=this.vy/vel*maxV;}
    this.x+=this.vx; this.y+=this.vy;
    this.x=Math.max(this.size,Math.min(W-this.size,this.x));
    this.y=Math.max(this.size,Math.min(H-this.size,this.y));
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>22) this.trail.pop();
    if(this.invincible>0) this.invincible--;
    this.pulse+=0.1;
  }
  draw() {
    for(let i=this.trail.length-1;i>=0;i--) {
      const t=this.trail[i],a=(1-i/this.trail.length)*0.35;
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#a78bfa';
      ctx.beginPath(); ctx.arc(t.x,t.y,this.size*(1-i/this.trail.length)*0.9,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    const blink=this.invincible>0&&Math.floor(this.invincible/4)%2===0;
    if(!blink) {
      ctx.save(); ctx.shadowColor='#a78bfa'; ctx.shadowBlur=20+Math.sin(this.pulse)*8;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(this.x,this.y-this.size); ctx.lineTo(this.x+this.size*0.85,this.y+this.size*0.75); ctx.lineTo(this.x,this.y+this.size*0.35); ctx.lineTo(this.x-this.size*0.85,this.y+this.size*0.75); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.fillStyle='#60a5fa'; ctx.shadowColor='#60a5fa'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(this.x,this.y-this.size*0.2,4,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
  }
}

class Game {
  constructor() {
    this.player=new Player(); this.obstacles=[]; this.particles=[]; this.gems=[];
    this.stars=Array.from({length:100},()=>new Star());
    this.keys={left:false,right:false,up:false,down:false};
    this.score=0; this.lives=3; this.level=1; this.speed=0;
    this.spawnTimer=0; this.spawnInterval=80; this.running=true;
    this.combo=0; this.comboTimer=0; this.shake=0; this.gemSpawn=0;
  }
  resize() { this.player.resize(); this.stars.forEach(s=>{s.x=Math.random()*W;}); }
  handleKeys(e,down) {
    const map={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down','q':'left','Q':'left','d':'right','D':'right','z':'up','Z':'up','s':'down','S':'down','a':'left','A':'left','w':'up','W':'up'};
    if(map[e.key]){this.keys[map[e.key]]=down;e.preventDefault();}
  }
  update() {
    if(!this.running) return;
    this.score++; this.speed=Math.min(this.score/400,3);
    this.level=1+Math.floor(this.score/600);
    this.spawnInterval=Math.max(18,80-this.level*9);
    if(this.comboTimer>0) this.comboTimer--; else this.combo=0;
    this.stars.forEach(s=>s.update(this.speed));
    this.player.update(this.keys,this.speed);
    this.spawnTimer++;
    if(this.spawnTimer>=this.spawnInterval) {
      this.spawnTimer=0; this.obstacles.push(new Obstacle(this.level));
      if(this.level>2&&Math.random()<0.35) this.obstacles.push(new Obstacle(this.level));
      if(this.level>4&&Math.random()<0.2) this.obstacles.push(new Obstacle(this.level));
    }
    this.gemSpawn++;
    if(this.gemSpawn>280) { this.gemSpawn=0; this.gems.push({x:Math.random()*(W-80)+40,y:-24,vy:2.2,pulse:0}); }
    this.gems.forEach(g=>{g.y+=g.vy;g.pulse+=0.12;});
    this.gems=this.gems.filter(g=>{
      if(g.y>H+40) return false;
      const dx=g.x-this.player.x,dy=g.y-this.player.y;
      if(Math.sqrt(dx*dx+dy*dy)<22){this.combo++;this.comboTimer=140;this.score+=10*Math.max(1,this.combo);for(let i=0;i<10;i++)this.particles.push(new Particle(g.x,g.y,'#facc15'));return false;}
      return true;
    });
    this.obstacles.forEach(o=>o.update());
    if(this.player.invincible===0) {
      for(const o of this.obstacles) {
        if(o.hits(this.player)){this.lives--;this.player.invincible=130;this.shake=22;for(let i=0;i<24;i++)this.particles.push(new Particle(this.player.x,this.player.y,'#f472b6'));if(this.lives<=0){this.running=false;this.showEnd();}break;}
      }
    }
    this.obstacles=this.obstacles.filter(o=>!o.offscreen());
    this.particles.forEach(p=>p.update()); this.particles=this.particles.filter(p=>p.life>0);
    if(this.shake>0) this.shake--;
    scoreEl.textContent=this.score; levelEl.textContent=this.level;
    livesEl.textContent='♥'.repeat(this.lives)+'♡'.repeat(3-this.lives);
  }
  draw() {
    ctx.save();
    if(this.shake>0) ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake);
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.strokeStyle='rgba(124,58,237,0.07)'; ctx.lineWidth=1;
    const off=(this.score*this.speed*0.3)%60;
    for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=-60+off;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();
    this.stars.forEach(s=>s.draw());
    this.gems.forEach(g=>{ctx.save();ctx.globalAlpha=0.7+Math.sin(g.pulse)*0.3;ctx.shadowColor='#facc15';ctx.shadowBlur=16;ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(g.x,g.y-12);ctx.lineTo(g.x+10,g.y);ctx.lineTo(g.x,g.y+12);ctx.lineTo(g.x-10,g.y);ctx.closePath();ctx.fill();ctx.restore();});
    this.obstacles.forEach(o=>o.draw());
    this.player.draw();
    this.particles.forEach(p=>p.draw());
    if(this.combo>1){ctx.save();ctx.font=`bold ${16+this.combo*2}px Courier New`;ctx.fillStyle='#facc15';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,this.comboTimer/40);ctx.shadowColor='#facc15';ctx.shadowBlur=12;ctx.fillText(`COMBO ×${this.combo}`,W/2,H/2-50);ctx.restore();}
    ctx.restore();
  }
  showEnd() {
    if(this.score>best){best=this.score;bestEl.textContent='MEILLEUR: '+best;}
    overlay.querySelector('h1').textContent='GAME OVER';
    overlay.querySelector('p').textContent=`SCORE: ${this.score}  ·  NIVEAU: ${this.level}`;
    document.getElementById('startBtn').textContent='REJOUER';
    overlay.style.display='flex';
  }
}

let keyHandler;
function startGame() {
  if(game&&keyHandler){document.removeEventListener('keydown',keyHandler);document.removeEventListener('keyup',keyHandler);}
  cancelAnimationFrame(animId); overlay.style.display='none';
  game=new Game();
  dpad.style.display=isMobile()?'block':'none';
  keyHandler=(e)=>{game.handleKeys(e,e.type==='keydown');};
  document.addEventListener('keydown',keyHandler);
  document.addEventListener('keyup',keyHandler);
  function loop(){game.update();game.draw();animId=requestAnimationFrame(loop);}
  loop();
}

document.getElementById('startBtn').addEventListener('click',startGame);
['up','down','left','right'].forEach(dir=>{
  const btn=document.getElementById(dir);
  const s=(e)=>{e.preventDefault();game&&(game.keys[dir]=true);btn.classList.add('pressed');};
  const e2=(e)=>{e.preventDefault();game&&(game.keys[dir]=false);btn.classList.remove('pressed');};
  btn.addEventListener('touchstart',s,{passive:false}); btn.addEventListener('touchend',e2,{passive:false});
  btn.addEventListener('mousedown',s); btn.addEventListener('mouseup',e2);
});
let tx,ty;
document.addEventListener('touchstart',(e)=>{if(e.target.closest('#dpad')||e.target.closest('#overlay'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchmove',(e)=>{if(!game||!game.running||e.target.closest('#dpad'))return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty,t=25;game.keys.left=dx<-t;game.keys.right=dx>t;game.keys.up=dy<-t;game.keys.down=dy>t;},{passive:true});
document.addEventListener('touchend',()=>{if(game)game.keys={left:false,right:false,up:false,down:false};},{passive:true});
</script>
</body>
</html>
